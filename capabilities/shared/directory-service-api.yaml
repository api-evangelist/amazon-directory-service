naftiko: "1.0.0-alpha1"

info:
  label: Amazon Directory Service API
  description: Amazon Directory Service API for managing Microsoft Active Directory in AWS, including directory creation, trust relationships, snapshots, and domain controllers.
  tags:
    - Amazon Directory Service
    - Active Directory
    - Identity Management
    - Hybrid Cloud
    - AWS
  created: "2026-04-19"
  modified: "2026-04-19"

binds:
  - namespace: env
    keys:
      AWS_ACCESS_KEY_ID: AWS_ACCESS_KEY_ID
      AWS_SECRET_ACCESS_KEY: AWS_SECRET_ACCESS_KEY
      AWS_REGION: AWS_REGION

capability:
  consumes:
    - type: http
      namespace: directory-service
      baseUri: https://ds.amazonaws.com
      description: Amazon Directory Service REST API for managing Active Directory.
      authentication:
        type: apikey
        key: Authorization
        value: "{{AWS_ACCESS_KEY_ID}}"
        placement: header
      resources:
        - name: directories
          path: /
          description: Managed directories
          operations:
            - name: describe-directories
              method: POST
              description: List all directories in the account
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

            - name: create-directory
              method: POST
              description: Create a Simple AD directory
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

            - name: create-microsoft-ad
              method: POST
              description: Create an AWS Managed Microsoft AD directory
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

            - name: delete-directory
              method: POST
              description: Delete a directory
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: domain-controllers
          path: /
          description: Domain controllers for directories
          operations:
            - name: describe-domain-controllers
              method: POST
              description: List domain controllers for a directory
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: trusts
          path: /
          description: Trust relationships between directories
          operations:
            - name: describe-trusts
              method: POST
              description: List trust relationships
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

            - name: create-trust
              method: POST
              description: Create a trust relationship
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

            - name: delete-trust
              method: POST
              description: Delete a trust relationship
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: snapshots
          path: /
          description: Directory snapshots
          operations:
            - name: describe-snapshots
              method: POST
              description: List directory snapshots
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

            - name: create-snapshot
              method: POST
              description: Create a manual snapshot
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

            - name: restore-from-snapshot
              method: POST
              description: Restore a directory from a snapshot
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

            - name: delete-snapshot
              method: POST
              description: Delete a snapshot
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: ip-routes
          path: /
          description: IP routes for Microsoft AD
          operations:
            - name: list-ip-routes
              method: POST
              description: List IP routes for a directory
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

            - name: add-ip-routes
              method: POST
              description: Add IP routes to a directory
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: certificates
          path: /
          description: Certificates registered for directories
          operations:
            - name: list-certificates
              method: POST
              description: List certificates for a directory
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

            - name: register-certificate
              method: POST
              description: Register a certificate
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

            - name: deregister-certificate
              method: POST
              description: Deregister a certificate
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: log-subscriptions
          path: /
          description: Log subscriptions for directories
          operations:
            - name: list-log-subscriptions
              method: POST
              description: List log subscriptions
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

            - name: create-log-subscription
              method: POST
              description: Create a log subscription
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

            - name: delete-log-subscription
              method: POST
              description: Delete a log subscription
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: shared-directories
          path: /
          description: Directories shared with other accounts
          operations:
            - name: share-directory
              method: POST
              description: Share a directory with another account
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

            - name: describe-shared-directories
              method: POST
              description: List shared directories
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

            - name: unshare-directory
              method: POST
              description: Unshare a directory
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: limits
          path: /
          description: Directory service limits
          operations:
            - name: get-directory-limits
              method: POST
              description: Get directory limits for the account
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8100
      namespace: directory-service-rest
      resources:
        - path: /v1/directories
          name: directories
          description: Managed directories
          operations:
            - method: GET
              name: describe-directories
              description: List directories
              call: "directory-service.describe-directories"
              outputParameters:
                - type: object
                  mapping: "$."

        - path: /v1/trusts
          name: trusts
          description: Trust relationships
          operations:
            - method: GET
              name: describe-trusts
              description: List trusts
              call: "directory-service.describe-trusts"
              outputParameters:
                - type: object
                  mapping: "$."

        - path: /v1/snapshots
          name: snapshots
          description: Directory snapshots
          operations:
            - method: GET
              name: describe-snapshots
              description: List snapshots
              call: "directory-service.describe-snapshots"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9100
      namespace: directory-service-mcp
      transport: http
      tools:
        - name: describe-directories
          description: List all directories in the account
          hints:
            readOnly: true
            openWorld: true
          call: "directory-service.describe-directories"
          outputParameters:
            - type: object
              mapping: "$."

        - name: create-directory
          description: Create a Simple AD directory
          hints:
            readOnly: false
            destructive: false
          call: "directory-service.create-directory"
          outputParameters:
            - type: object
              mapping: "$."

        - name: create-microsoft-ad
          description: Create an AWS Managed Microsoft AD directory
          hints:
            readOnly: false
            destructive: false
          call: "directory-service.create-microsoft-ad"
          outputParameters:
            - type: object
              mapping: "$."

        - name: delete-directory
          description: Delete a directory
          hints:
            readOnly: false
            destructive: false
          call: "directory-service.delete-directory"
          outputParameters:
            - type: object
              mapping: "$."

        - name: describe-domain-controllers
          description: List domain controllers for a directory
          hints:
            readOnly: true
            openWorld: true
          call: "directory-service.describe-domain-controllers"
          outputParameters:
            - type: object
              mapping: "$."

        - name: describe-trusts
          description: List trust relationships for directories
          hints:
            readOnly: true
            openWorld: true
          call: "directory-service.describe-trusts"
          outputParameters:
            - type: object
              mapping: "$."

        - name: create-trust
          description: Create a trust relationship between directories
          hints:
            readOnly: false
            destructive: false
          call: "directory-service.create-trust"
          outputParameters:
            - type: object
              mapping: "$."

        - name: delete-trust
          description: Delete a trust relationship
          hints:
            readOnly: false
            destructive: false
          call: "directory-service.delete-trust"
          outputParameters:
            - type: object
              mapping: "$."

        - name: describe-snapshots
          description: List directory snapshots
          hints:
            readOnly: true
            openWorld: true
          call: "directory-service.describe-snapshots"
          outputParameters:
            - type: object
              mapping: "$."

        - name: create-snapshot
          description: Create a manual snapshot of a directory
          hints:
            readOnly: false
            destructive: false
          call: "directory-service.create-snapshot"
          outputParameters:
            - type: object
              mapping: "$."
