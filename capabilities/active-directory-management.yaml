naftiko: 1.0.0-alpha2
info:
  label: Amazon Directory Service Active Directory Management
  description: Workflow capability for identity engineers and cloud architects to manage AWS Managed Microsoft Active Directory,
    including directory provisioning, trust relationships, domain controllers, snapshots, IP routing, and certificate management
    for hybrid identity workloads.
  tags:
  - Amazon Directory Service
  - Active Directory
  - Identity Management
  - Hybrid Cloud
  - AWS
  created: '2026-04-19'
  modified: '2026-05-06'
binds:
- namespace: env
  keys:
    AWS_ACCESS_KEY_ID: AWS_ACCESS_KEY_ID
    AWS_SECRET_ACCESS_KEY: AWS_SECRET_ACCESS_KEY
    AWS_REGION: AWS_REGION
capability:
  consumes:
  - type: http
    namespace: directory-service
    baseUri: https://ds.amazonaws.com
    description: Amazon Directory Service REST API for managing Active Directory.
    authentication:
      type: apikey
      key: Authorization
      value: '{{AWS_ACCESS_KEY_ID}}'
      placement: header
    resources:
    - name: directories
      path: /
      description: Managed directories
      operations:
      - name: describe-directories
        method: POST
        description: List all directories in the account
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-directory
        method: POST
        description: Create a Simple AD directory
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-microsoft-ad
        method: POST
        description: Create an AWS Managed Microsoft AD directory
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: delete-directory
        method: POST
        description: Delete a directory
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: domain-controllers
      path: /
      description: Domain controllers for directories
      operations:
      - name: describe-domain-controllers
        method: POST
        description: List domain controllers for a directory
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: trusts
      path: /
      description: Trust relationships between directories
      operations:
      - name: describe-trusts
        method: POST
        description: List trust relationships
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-trust
        method: POST
        description: Create a trust relationship
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: delete-trust
        method: POST
        description: Delete a trust relationship
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: snapshots
      path: /
      description: Directory snapshots
      operations:
      - name: describe-snapshots
        method: POST
        description: List directory snapshots
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-snapshot
        method: POST
        description: Create a manual snapshot
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: restore-from-snapshot
        method: POST
        description: Restore a directory from a snapshot
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: delete-snapshot
        method: POST
        description: Delete a snapshot
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: ip-routes
      path: /
      description: IP routes for Microsoft AD
      operations:
      - name: list-ip-routes
        method: POST
        description: List IP routes for a directory
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: add-ip-routes
        method: POST
        description: Add IP routes to a directory
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: certificates
      path: /
      description: Certificates registered for directories
      operations:
      - name: list-certificates
        method: POST
        description: List certificates for a directory
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: register-certificate
        method: POST
        description: Register a certificate
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: deregister-certificate
        method: POST
        description: Deregister a certificate
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: log-subscriptions
      path: /
      description: Log subscriptions for directories
      operations:
      - name: list-log-subscriptions
        method: POST
        description: List log subscriptions
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-log-subscription
        method: POST
        description: Create a log subscription
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: delete-log-subscription
        method: POST
        description: Delete a log subscription
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: shared-directories
      path: /
      description: Directories shared with other accounts
      operations:
      - name: share-directory
        method: POST
        description: Share a directory with another account
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: describe-shared-directories
        method: POST
        description: List shared directories
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: unshare-directory
        method: POST
        description: Unshare a directory
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: limits
      path: /
      description: Directory service limits
      operations:
      - name: get-directory-limits
        method: POST
        description: Get directory limits for the account
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    port: 8080
    namespace: directory-management-api
    description: Unified REST API for Amazon Directory Service Active Directory management workflows.
    resources:
    - path: /v1/directories
      name: directories
      description: Managed Active Directory instances
      operations:
      - method: GET
        name: describe-directories
        description: List all managed directories
        call: directory-service.describe-directories
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: create-microsoft-ad
        description: Create an AWS Managed Microsoft AD directory
        call: directory-service.create-microsoft-ad
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/trusts
      name: trusts
      description: Trust relationships between directories
      operations:
      - method: GET
        name: describe-trusts
        description: List trust relationships
        call: directory-service.describe-trusts
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: create-trust
        description: Create a trust relationship
        call: directory-service.create-trust
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/snapshots
      name: snapshots
      description: Directory snapshots for backup and restore
      operations:
      - method: GET
        name: describe-snapshots
        description: List directory snapshots
        call: directory-service.describe-snapshots
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: create-snapshot
        description: Create a manual directory snapshot
        call: directory-service.create-snapshot
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/certificates
      name: certificates
      description: Certificates for directory authentication
      operations:
      - method: GET
        name: list-certificates
        description: List registered certificates
        call: directory-service.list-certificates
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/shared-directories
      name: shared-directories
      description: Directories shared with other AWS accounts
      operations:
      - method: GET
        name: describe-shared-directories
        description: List shared directories
        call: directory-service.describe-shared-directories
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9090
    namespace: directory-management-mcp
    transport: http
    description: MCP server for AI-assisted Active Directory management.
    tools:
    - name: describe-directories
      description: List all AWS Managed Microsoft AD and Simple AD directories in the account
      hints:
        readOnly: true
        openWorld: true
      call: directory-service.describe-directories
      outputParameters:
      - type: object
        mapping: $.
    - name: create-microsoft-ad
      description: Create an AWS Managed Microsoft Active Directory in the AWS Cloud
      hints:
        readOnly: false
        destructive: false
      call: directory-service.create-microsoft-ad
      outputParameters:
      - type: object
        mapping: $.
    - name: create-directory
      description: Create a Simple AD directory powered by Samba 4
      hints:
        readOnly: false
        destructive: false
      call: directory-service.create-directory
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-directory
      description: Delete an AWS Directory Service directory
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: directory-service.delete-directory
      outputParameters:
      - type: object
        mapping: $.
    - name: describe-trusts
      description: List trust relationships established for AWS Managed Microsoft AD directories
      hints:
        readOnly: true
        openWorld: true
      call: directory-service.describe-trusts
      outputParameters:
      - type: object
        mapping: $.
    - name: create-trust
      description: Create a trust relationship between AWS Managed Microsoft AD and an on-premises directory
      hints:
        readOnly: false
        destructive: false
      call: directory-service.create-trust
      outputParameters:
      - type: object
        mapping: $.
    - name: describe-snapshots
      description: List manual snapshots of a directory for backup and restore purposes
      hints:
        readOnly: true
        openWorld: true
      call: directory-service.describe-snapshots
      outputParameters:
      - type: object
        mapping: $.
    - name: create-snapshot
      description: Create a manual snapshot of a directory for backup
      hints:
        readOnly: false
        destructive: false
      call: directory-service.create-snapshot
      outputParameters:
      - type: object
        mapping: $.
    - name: restore-from-snapshot
      description: Restore a directory to a previous state using a snapshot
      hints:
        readOnly: false
        destructive: false
      call: directory-service.restore-from-snapshot
      outputParameters:
      - type: object
        mapping: $.
    - name: describe-domain-controllers
      description: List domain controllers provisioned for an AWS Managed Microsoft AD directory
      hints:
        readOnly: true
        openWorld: true
      call: directory-service.describe-domain-controllers
      outputParameters:
      - type: object
        mapping: $.
    - name: list-certificates
      description: List certificates registered for LDAPS or client certificate authentication
      hints:
        readOnly: true
        openWorld: true
      call: directory-service.list-certificates
      outputParameters:
      - type: object
        mapping: $.
    - name: share-directory
      description: Share a directory with another AWS account for multi-account access
      hints:
        readOnly: false
        destructive: false
      call: directory-service.share-directory
      outputParameters:
      - type: object
        mapping: $.
    - name: describe-shared-directories
      description: List directories shared from your account or shared with your account
      hints:
        readOnly: true
        openWorld: true
      call: directory-service.describe-shared-directories
      outputParameters:
      - type: object
        mapping: $.
    - name: get-directory-limits
      description: Get the directory service limits for the current AWS account and region
      hints:
        readOnly: true
        openWorld: true
      call: directory-service.get-directory-limits
      outputParameters:
      - type: object
        mapping: $.
