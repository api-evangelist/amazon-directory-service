      tags:
      - '#X Amz Target=DirectoryService 20150416.DescribeUpdateDirectory'
components:
  schemas:
    UpdateType:
      type: string
      enum:
      - OS
    DescribeUpdateDirectoryResult:
      type: object
      properties:
        UpdateActivities:
          allOf:
          - $ref: '#/components/schemas/UpdateActivities'
          - description: ' The list of update activities on a directory for the requested update type. '
        NextToken:
          allOf:
          - $ref: '#/components/schemas/NextToken'
          - description: ' If not null, more results are available. Pass this value for the <code>NextToken</code> parameter. '
    UpdateValue:
      type: object
      properties:
        OSUpdateSettings:
          allOf:
          - $ref: '#/components/schemas/OSUpdateSettings'
          - description: ' The OS update related settings. '
      description: ' The value for a given type of <code>UpdateSettings</code>. '
    ClientException: {}
    UpdateInfoEntry:
      type: object
      properties:
        Region:
          allOf:
          - $ref: '#/components/schemas/RegionName'
          - description: ' The name of the Region. '
        Status:
          allOf:
          - $ref: '#/components/schemas/UpdateStatus'
          - description: ' The status of the update performed on the directory. '
        StatusReason:
          allOf:
          - $ref: '#/components/schemas/UpdateStatusReason'
          - description: ' The reason for the current status of the update type activity. '
        InitiatedBy:
          allOf:
          - $ref: '#/components/schemas/InitiatedBy'
          - description: ' This specifies if the update was initiated by the customer or by the service team. '
        NewValue:
          allOf:
          - $ref: '#/components/schemas/UpdateValue'
          - description: ' The new value of the target setting. '
        PreviousValue:
          allOf:
          - $ref: '#/components/schemas/UpdateValue'
          - description: ' The old value of the target setting. '
        StartTime:
          allOf:
          - $ref: '#/components/schemas/StartDateTime'
          - description: ' The start time of the <code>UpdateDirectorySetup</code> for the particular type. '
        LastUpdatedDateTime:
          allOf:
          - $ref: '#/components/schemas/LastUpdatedDateTime'
          - description: ' The last updated date and time of a particular directory setting. '
      description: ' An entry of update information related to a requested update type. '
    DirectoryId:
      type: string
      pattern: ^d-[0-9a-f]{10}$
    StartDateTime:
      type: string
      format: date-time
    DescribeUpdateDirectoryRequest:
      type: object
      required:
      - DirectoryId
      - UpdateType
      title: DescribeUpdateDirectoryRequest
      properties:
        DirectoryId:
          allOf:
          - $ref: '#/components/schemas/DirectoryId'
          - description: ' The unique identifier of the directory. '
        UpdateType:
          allOf:
          - $ref: '#/components/schemas/UpdateType'
          - description: ' The type of updates you want to describe for the directory. '
        RegionName:
          allOf:
          - $ref: '#/components/schemas/RegionName'
          - description: ' The name of the Region. '
        NextToken:
          allOf:
          - $ref: '#/components/schemas/NextToken'
          - description: ' The <code>DescribeUpdateDirectoryResult</code>. NextToken value from a previous call to <a>DescribeUpdateDirectory</a>. Pass null if this is the first call. '
    InitiatedBy:
      type: string
    UpdateActivities:
      type: array
      items:
        $ref: '#/components/schemas/UpdateInfoEntry'
    UpdateStatusReason:
      type: string
    OSUpdateSettings:
      type: object
      properties:
        OSVersion:
          allOf:
          - $ref: '#/components/schemas/OSVersion'
          - description: ' OS version that the directory needs to be updated to. '
      description: ' OS version that the directory needs to be updated to. '
    OSVersion:
      type: string
      enum:
      - SERVER_2012
      - SERVER_2019
    DirectoryDoesNotExistException: {}
    NextToken:
      type: string
    UpdateStatus:
      type: string
      enum:
      - Updated
      - Updating
      - UpdateFailed
    ServiceException: {}
    LastUpdatedDateTime:
      type: string
      format: date-time
    InvalidParameterException: {}
    AccessDeniedException: {}
    RegionName:
      type: string
      minLength: 8
      maxLength: 32
    InvalidNextTokenException: {}
