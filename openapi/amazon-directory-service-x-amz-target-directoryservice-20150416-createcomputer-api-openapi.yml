              schema:
                $ref: '#/components/schemas/EntityAlreadyExistsException'
        '483':
          description: EntityDoesNotExistException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityDoesNotExistException'
        '484':
          description: InvalidParameterException
