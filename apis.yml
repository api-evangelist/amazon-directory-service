aid: amazon-directory-service
name: Amazon Directory Service
description: >-
  AWS Directory Service for Microsoft Active Directory, also known as AWS
  Managed Microsoft AD, enables your directory-aware workloads and AWS resources
  to use managed Active Directory in AWS. It provides a fully managed,
  highly available Microsoft Active Directory in the AWS Cloud.
